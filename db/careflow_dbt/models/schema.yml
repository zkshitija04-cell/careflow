version: 2

models:
  - name: stg_ehr_events
    columns:
      - name: case_id
        data_tests:
          - not_null
      - name: activity_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Registration
                  - Triage
                  - X-Ray
                  - Doctor Consultation
                  - Discharge
      - name: event_timestamp
        data_tests:
          - not_null

  - name: event_log
    columns:
      - name: Case_ID
        data_tests:
          - not_null
      - name: Activity_Name
        data_tests:
          - not_null
      - name: Timestamp
        data_tests:
          - not_null